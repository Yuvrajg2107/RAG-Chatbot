[project]
name = "margin-rag"
version = "1.0.0"
description = "A PDF question-answering workspace with local semantic search and verifiable citations."
requires-python = ">=3.11,<3.14"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn>=0.34,<1", "python-multipart>=0.0.20,<1",
  "pypdf>=6.0,<7", "numpy>=2.0,<3", "fastembed>=0.9.1,<0.10",
  "httpx>=0.28,<1", "python-dotenv>=1.0,<2", "vercel-blob>=0.5.0,<0.6",
]

[tool.uv]
# Optional Hub download accelerator; plain HTTPS works without its native binary.
exclude-dependencies = ["hf-xet"]

[tool.vercel]
entrypoint = "app.main:app"

[tool.vercel.scripts]
build = "python scripts/prepare_model.py"

[dependency-groups]
dev = ["pytest>=8,<10", "reportlab>=4,<5", "ruff>=0.12,<1", "pip-audit>=2.9,<3"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501", "B008"]
